services:
  nginx:
    image: nginx:stable-alpine3.24-perl
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./registration-form:/var/www/registration-form
    depends_on:
      - app
      - db

  app:
    build:
      context: docker
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./registration-form:/var/www/registration-form
      - ./registration-formvendor:/var/www/registration-form/vendor

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}" ]
      retries: 3
      timeout: 5s

  artisan:
    build:
      context: docker
      dockerfile: Dockerfile
    volumes:
      - ./registration-form:/var/www/registration-form
    entrypoint: [ "php", "/var/www/registration-form/artisan" ]

volumes:
  db_data:
  vendor:

