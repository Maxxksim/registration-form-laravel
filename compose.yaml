services:
  nginx:
    image: nginx:stable-alpine3.24-perl
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./registration-form:/var/www/registration-form
    depends_on:
      - app
      - db

  app:
    build:
      context: docker
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./registration-form:/var/www/registration-form
      - vendor:/var/www/registration-form/vendor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_IDE_CONFIG: "serverName=${PHP_IDE_SERVER_NAME}"

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}" ]
      retries: 3
      timeout: 5s

  artisan:
    build:
      context: docker
      dockerfile: Dockerfile
    volumes:
      - ./registration-form:/var/www/registration-form
    entrypoint: [ "php", "/var/www/registration-form/artisan" ]

  composer:
      image: composer:latest
      working_dir: /var/www/registration-form
      volumes:
        - ./registration-form:/var/www/registration-form
        -  vendor:/var/www/registration-form/vendor
      entrypoint: ["composer", "--ignore-platform-reqs"]

  npm:
    image: node:latest
    working_dir: /var/www/registration-form
    volumes:
      - ./registration-form:/var/www/registration-form
      - node_modules:/var/www/registration-form/node_modules
    entrypoint: ['npm']

volumes:
  db_data:
  vendor:
  node_modules:

